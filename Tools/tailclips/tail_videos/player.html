<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>호랑이 꼬리 영상 자료</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
:root { --bg: #f6f3ee; --sheet: #fffdf9; --ink: #2b2118; --soft: #6e5d4c; --line: #e4dbcf; --accent: #d9772b;
  --accent-soft: #fbe9d8; --sel: #fff1e2; --body: "Noto Sans KR", system-ui, sans-serif; --head: "Gowun Dodum", "Noto Sans KR", sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1b1713; --sheet: #241e18; --ink: #f3e9dc;
  --soft: #bba893; --line: #3a3027; --accent: #f0954a; --accent-soft: #3a2a1c; --sel: #33261a; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #1b1713; --sheet: #241e18; --ink: #f3e9dc; --soft: #bba893; --line: #3a3027;
  --accent: #f0954a; --accent-soft: #3a2a1c; --sel: #33261a; color-scheme: dark }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); }
header { padding-block: 18px 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { font: 700 24px/1.25 var(--head); margin: 0 0 4px; text-wrap: balance; }
.lead { color: var(--soft); margin: 0; max-width: 70ch; }
.kind { font-size: 12px; font-weight: 700; letter-spacing: .04em; color: var(--accent); background: var(--accent-soft);
  border-radius: 4px; padding: 1px 7px; }
.item { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border: 1px solid var(--line);
  border-radius: 8px; background: var(--sheet); text-align: left; color: var(--ink); font: inherit; min-width: 0; }
.item b { font-size: 15px; }
.by { font-size: 12px; color: var(--soft); }
.what { font-size: 14px; }
.use { font-size: 13px; color: var(--soft); }
a { color: var(--accent); }

main { display: grid; grid-template-columns: minmax(300px, 420px) minmax(0, 1fr); gap: 16px; padding-block: 0 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.list { display: flex; flex-direction: column; gap: 8px; max-height: calc(100vh - 110px); overflow-y: auto; padding-right: 4px; }
.item { cursor: pointer; }
.item:hover, .item:focus-visible { border-color: var(--accent); outline: none; }
.item[aria-pressed="true"] { background: var(--sel); border-color: var(--accent); }
.stage { position: sticky; top: 12px; align-self: start; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.frame { width: 100%; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: #000; }
.frame iframe { width: 100%; height: 100%; border: 0; display: block; }
#now { font-weight: 700; }
@media (max-width: 820px) { main { grid-template-columns: minmax(0, 1fr); } .stage { position: static; order: -1; } .list { max-height: none; } }
</style>
<header><h1>호랑이 꼬리 영상 자료</h1>
<p class="lead">게임과 3D 애니메이션 속 호랑이·고양이 꼬리 12편. 왼쪽에서 고르면 오른쪽에서 바로 재생됩니다(꼬리가 잘 보이는 시점부터).</p></header>
<main>
  <div class="list" role="list"><button class="item" type="button" data-id="P4l6uWxe-vk" data-start="0"><span><span class="kind">게임</span> <span class="by">1. IGN · 확신 높음</span></span><b>Stray - Official Gameplay &amp; Release Window Trailer</b><span class="what">Stray 고양이 주인공의 3인칭 게임플레이 트레일러. 카메라가 고양이 뒤를 따라가서 걷기·뛰기·점프 때 꼬리가 화면에 자주 보이는 게임이다. 이 고양이는 애니메이터 한 명이 실제 고양이를 참고해 손으로 키 애니메이션한 것으로 알려져 있다.</span><span class="use">우리 호랑이에: 걸을 때 꼬리를 위로 세우고 끝을 살짝 꺾는 모양과, 3인칭 카메라에서 꼬리가 얼마나 보이는지를 참고.</span></button><button class="item" type="button" data-id="QET-k0NXe6w" data-start="0"><span><span class="kind">게임</span> <span class="by">2. IGN · 확신 높음</span></span><b>Stray - Official Launch Trailer</b><span class="what">Stray 출시 트레일러. 고양이가 도시를 돌아다니는 장면 위주라 걷기·멈춤·앉기 때의 꼬리를 볼 수 있을 것으로 보인다.</span><span class="use">우리 호랑이에: 멈춰 서거나 앉을 때 꼬리를 몸 쪽으로 감는 동작과 걷기에서 멈춤으로 넘어갈 때 꼬리가 늦게 따라오는 모습.</span></button><button class="item" type="button" data-id="lzgW--CdB6Y" data-start="0"><span><span class="kind">게임</span> <span class="by">3. GameTrailers · 확신 중간</span></span><b>Little Kitty, Big City - Official Launch Trailer</b><span class="what">아기 고양이가 주인공인 스타일라이즈드(카툰풍) 3D 게임의 출시 트레일러. 머리가 크고 몸이 짧은 귀여운 고양이라 우리 치비 호랑이와 비율이 가깝다.</span><span class="use">우리 호랑이에: 짧고 통통한 몸의 캐릭터에서 꼬리를 과장해 크게 흔드는 정도와 리듬을 참고.</span></button><button class="item" type="button" data-id="eO2gH8kUT9c" data-start="0"><span><span class="kind">게임</span> <span class="by">4. dint 999 · 확신 중간</span></span><b>Animate Animal Tails SSE</b><span class="what">Skyrim Special Edition 모드 &#x27;Animate Animal Tails&#x27; 소개 영상으로 보이며, 검색 결과 요약에 따르면 고양이 수인 종족(카짓) 등의 꼬리를 움직이게 만드는 모드. 게임 안 3D 캐릭터의 꼬리만 바뀌는 모습을 볼 수 있다.</span><span class="use">우리 호랑이에: 꼬리가 뻣뻣할 때와 움직일 때의 차이, 그리고 사람형(두 발) 캐릭터 꼬리를 게임에서 얼마나 흔들어야 자연스러운지 비교.</span></button><button class="item" type="button" data-id="fNvw3FKpazE" data-start="0"><span><span class="kind">3D 영화·시리즈</span> <span class="by">5. KinoCheck Archive · 확신 중간</span></span><b>Intro to Shere Khan Movie Clip - The Jungle Book (2016)</b><span class="what">정글북(2016) CG 호랑이 셰어 칸이 처음 등장하는 장면 클립. 사실적인 CG 호랑이가 걸으며 다가오는 장면이라 묵직하게 낮게 늘어뜨린 호랑이 꼬리를 볼 수 있다.</span><span class="use">우리 호랑이에: 호랑이 꼬리 특유의 무게감(아래로 처지다가 끝만 말아 올리는 모양)과 느린 흔들림 속도.</span></button><button class="item" type="button" data-id="IDkGjz1QOpw" data-start="0"><span><span class="kind">3D 영화·시리즈</span> <span class="by">6. Animation Society · 확신 중간</span></span><b>Puss In Boots 2: The Last Wish Clip - Cats Dance Off (2022) | Animation Society</b><span class="what">장화신은 고양이: 끝내주는 모험의 고양이 춤 대결 장면 클립. 두 발로 서는 카툰 고양이들이 크게 움직이는 장면이라 꼬리가 몸 동작을 따라 출렁이는 연기를 볼 수 있을 것으로 보인다.</span><span class="use">우리 호랑이에: 두 발로 서는 동물 캐릭터에서 몸통 동작에 꼬리가 반 박자 늦게 따라오는 과장된 겹침(오버랩) 연기.</span></button><button class="item" type="button" data-id="HYmF8kvAdGI" data-start="0"><span><span class="kind">3D 영화·시리즈</span> <span class="by">7. Universal Kids · 확신 낮음</span></span><b>&quot;Tigress&quot; Featurette | Kung Fu Panda 2</b><span class="what">쿵푸팬더 2의 타이그리스 캐릭터 소개 피처렛. 두 발로 서는 3D 호랑이 캐릭터 장면이 나오지만 인터뷰가 섞여 있어 꼬리가 길게 보이는지는 확인하지 못했다.</span><span class="use">우리 호랑이에: 두 발 호랑이 캐릭터의 서 있기·무술 동작에서 꼬리를 얼마나 절제해서 쓰는지 비교용.</span></button><button class="item" type="button" data-id="vl91tLuTkhY" data-start="0"><span><span class="kind">3D 리그·데모</span> <span class="by">8. FImpossible Creations · 확신 높음</span></span><b>[Unity Package] Tail Animator - Bend your models with procedural animation!</b><span class="what">Unity용 절차적(procedural) 꼬리 애니메이션 패키지 Tail Animator의 소개 영상. 뼈 체인을 따라 꼬리가 휘고 흔들리는 효과를 시연한다.</span><span class="use">우리 호랑이에: 우리 8본 스프링 체인과 같은 방식의 결과물이라, 파동이 꼬리 끝까지 전달되는 속도와 끝부분 늘어짐 설정의 기준으로 삼기.</span></button><button class="item" type="button" data-id="zOVHjDFfdGI" data-start="0"><span><span class="kind">3D 리그·데모</span> <span class="by">9. Brendan Gallagher · 확신 높음</span></span><b>Maya Animation - Animating a Overlapping Tail Critter</b><span class="what">Maya에서 꼬리 달린 작은 생물의 꼬리 오버랩(겹침 동작)을 손으로 키 애니메이션하는 강의(2편 중 1편). 꼬리 마디마다 동작이 늦게 전달되는 원리를 보여준다.</span><span class="use">우리 호랑이에: 몸 → 꼬리 뿌리 → 끝으로 갈수록 몇 프레임씩 늦어지는 파동과 끝부분이 더 크게 휘는 모양을 스프링 값 조정 기준으로.</span></button><button class="item" type="button" data-id="uOejNL5zG44" data-start="0"><span><span class="kind">3D 리그·데모</span> <span class="by">10. Martin Cvetkov · 확신 중간</span></span><b>Bengal cat model walk cycle animation</b><span class="what">3ds Max로 모델링·리깅·애니메이션한 벵갈 고양이 3D 걷기 사이클(검색 요약 기준). 고양이 걷기에서 꼬리가 어떻게 들려 흔들리는지 반복해서 볼 수 있다.</span><span class="use">우리 호랑이에: 걷기 사이클 한 주기 안에서 꼬리 흔들림이 몇 번, 어느 방향으로 일어나는지 타이밍 참고.</span></button><button class="item" type="button" data-id="L0lYq6ZKl8s" data-start="0"><span><span class="kind">3D 리그·데모</span> <span class="by">11. Vladeta Kisin · 확신 중간</span></span><b>How to Make Your Character&#x27;s Tail and Ears Follow Animations in UE5 (Dynamic Physics Bones)</b><span class="what">UE5에서 Physics Asset으로 캐릭터의 꼬리와 귀가 애니메이션을 따라 물리로 흔들리게 만드는 튜토리얼. 우리 게임과 같은 엔진(UE)의 꼬리 물리 결과를 보여준다.</span><span class="use">우리 호랑이에: 애니메이션 위에 물리를 얹을 때 꼬리가 너무 출렁이거나 축 늘어지지 않게 하는 정도를 비교.</span></button><button class="item" type="button" data-id="9Su5es3mL7c" data-start="0"><span><span class="kind">3D 리그·데모</span> <span class="by">12. GDC Festival of Gaming · 확신 낮음</span></span><b>On All Fours: Creating Realistic Quadruped Motion</b><span class="what">GDC 2016 강연(마이크로소프트 Tobias Karlsson). 게임에서 네 발 동물의 움직임을 만드는 방법을 다루는 강연으로, 고양이 꼬리만 다루는 것은 아니다.</span><span class="use">우리 호랑이에: 걷기/뛰기 속도에 따라 몸통 움직임이 바뀌는 원리를 꼬리 높이(걷기 높게, 뛰기 낮게) 전환 기준으로 참고.</span></button></div>
  <div class="stage"><div class="frame"><iframe id="player" title="선택한 영상" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>
    <div id="now"></div><a id="out" href="#" target="_blank" rel="noopener">YouTube에서 열기</a></div>
</main>
<script>
const items = [...document.querySelectorAll('.item')];
function play(btn, auto) {
  items.forEach(b => b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'));
  const id = btn.dataset.id, s = btn.dataset.start;
  document.getElementById('player').src = 'https://www.youtube-nocookie.com/embed/' + id + '?rel=0&start=' + s + (auto ? '&autoplay=1&mute=1' : '');
  document.getElementById('now').textContent = btn.querySelector('b').textContent;
  document.getElementById('out').href = 'https://www.youtube.com/watch?v=' + id + (s > 0 ? '&t=' + s + 's' : '');
}
items.forEach(b => b.addEventListener('click', () => play(b, true)));
if (items.length) play(items[0], false);
</script>
