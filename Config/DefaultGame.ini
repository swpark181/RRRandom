; Round 100 (online play, "지연율이 올라갈때 끊기는 모습"): on an internet game hosted by a player the engine shares
; TotalNetBandwidth between the joiners and clamps each to Min..MaxDynamicBandwidth bytes a second; its defaults (32000,
; 4000 to 7000) are from dial-up days and starve six animal friends, their shots and the town's wrecks, which shows as
; bodies standing still and then jumping. (LAN games aren't clamped.)
[/Script/Engine.GameNetworkManager]
TotalNetBandwidth=600000
MaxDynamicBandwidth=120000
MinDynamicBandwidth=40000
