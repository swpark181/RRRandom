[/Script/EngineSettings.GameMapsSettings]
; Engine's built-in basic level (floor + lights) is the arena until our own map is saved.
; The game starts on the engine's empty Entry map, which the prefix below turns into the title screen.
EditorStartupMap=/Engine/Maps/Templates/Template_Default.Template_Default
GameDefaultMap=/Engine/Maps/Entry.Entry
GlobalDefaultGameMode=/Script/RRRandom.RRRandomGameMode
+GameModeMapPrefixes=(Name="Entry",GameMode="/Script/RRRandom.RRRandomTitleGameMode")

[/Script/Engine.RendererSettings]
r.DefaultFeature.AutoExposure=False
; Custom depth with stencil: the toon post process draws friend-or-foe silhouette lines from it
r.CustomDepth=3
; Round 91 (reflections and light): Lumen global illumination and reflections, so the glossy vehicles, puddles and glass
; show the sky and the town (screen space reflections alone lose anything off screen), and the street lamps, neon and
; vehicle lights bounce. Mesh distance fields feed Lumen's software tracing. Measured on this PC: ~0.3 ms over SSR.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
r.Lumen.TraceMeshSDFs=1

; GPU crash (DXGI_ERROR_DEVICE_REMOVED) when the window was resized, on a laptop GPU: a job on the async compute queue
; timed out (5 s) mid-resize and the next present lost the device. No async compute, and the classic swap chain
; present (no tearing flip mode), which hybrid-graphics laptops handle better across resizes.
[SystemSettings]
r.D3D12.AllowAsyncCompute=0
r.RDG.AsyncCompute=0
r.D3D12.UseAllowTearing=0
; Dice Land (the third person map) colors. Try values live in the game console (~), e.g. "rr.DiceLand.Saturation 1.3",
; then write the ones you like here. Saturation/Brightness: 1 = as made; FoxDesaturate/FoxCream: 0 = the fox as usual.
rr.DiceLand.Saturation=1.15
rr.DiceLand.Brightness=1.0
rr.DiceLand.FoxDesaturate=0.05
rr.DiceLand.FoxCream=0.03

